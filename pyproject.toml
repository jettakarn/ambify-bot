[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rostersync"
version = "0.1.0"
description = "Convert PDF shift rosters to calendar (.ics) files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "jxtssn" }]
keywords = ["pdf", "roster", "shift", "calendar", "ics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "pypdfium2>=4.0",
    "pdfplumber>=0.11",
    "pydantic>=2.0",
    "icalendar>=6.0",
    "typer>=0.12",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
rostersync = "rostersync.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rostersync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["rostersync"]
