[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twoshiftly"
version = "0.2.0"
description = "Convert scanned PDF shift rosters to calendar (.ics) files — offline OCR"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "jxtssn" }]
keywords = ["pdf", "roster", "shift", "calendar", "ics", "ocr", "2shiftly"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "pypdfium2>=4.0",
    "pydantic>=2.0",
    "icalendar>=6.0",
    "typer>=0.12",
    "rapidocr-onnxruntime>=1.2.3",
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
twoshiftly = "twoshiftly.cli:main"
2shiftly = "twoshiftly.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/twoshiftly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["twoshiftly"]
